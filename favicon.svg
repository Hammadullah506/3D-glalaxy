  <path d="M50 50 C 35 65, 20 60, 15 40 C 12 25, 30 15, 45 18 C 65 22, 75 40, 72 60 C 68 85, 40 88, 20 75" 
        fill="none" stroke="url(#armGrad1)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Core Glow -->
  <circle cx="50" cy="50" r="22" fill="url(#coreGlow)"/>
  <circle cx="50" cy="50" r="4" fill="#ffffff"/>
  <!-- Orbiting sparkle stars -->
  <circle cx="78" cy="30" r="2" fill="#38bdf8"/>
  <circle cx="22" cy="70" r="1.5" fill="#c084fc"/>
  <circle cx="70" cy="78" r="1.8" fill="#ffffff"/>
  <circle cx="30" cy="22" r="1.2" fill="#38bdf8"/>
</svg>
