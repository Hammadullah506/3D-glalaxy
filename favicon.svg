<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#090910"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <!-- Galaxy Spiral Arms -->
  <path d="M50 50 C 65 35, 80 40, 85 60 C 88 75, 70 85, 55 82 C 35 78, 25 60, 28 40 C 32 15, 60 12, 80 25" 
